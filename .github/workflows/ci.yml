name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run check
      - if: runner.os == 'Linux'
        run: bun run format:check
      - if: runner.os == 'Linux'
        run: npm pack --dry-run

  node20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Smoke test the installer on Node 20
        shell: bash
        run: |
          node --check desktop/install.mjs
          node desktop/install.mjs --version
          node desktop/install.mjs --help
          dir="$(mktemp -d)"
          printf '%s' '{"settings.v3":"{\"keybinds\":{}}"}' > "$dir/default.dat"
          node desktop/install.mjs --config "$dir/default.dat" --dry-run --diff
