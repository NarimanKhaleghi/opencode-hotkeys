<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
  <title id="title">Hotkey Studio</title>
  <desc id="desc">The Hotkey Studio dialog inside OpenCode, listing presets and rebindable actions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10161d"/>
      <stop offset="1" stop-color="#0a0e13"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1000" height="640" fill="#05080b"/>
  <rect x="24" y="24" width="952" height="592" rx="14" fill="url(#bg)" stroke="#28313c" filter="url(#shadow)"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <circle cx="56" cy="54" r="6" fill="#ff5f57"/>
    <circle cx="78" cy="54" r="6" fill="#febc2e"/>
    <circle cx="100" cy="54" r="6" fill="#28c840"/>
    <text x="500" y="59" text-anchor="middle" fill="#66707c" font-size="13">opencode — Hotkey Studio</text>

    <text x="78" y="126" fill="#f0f6fc" font-size="26" font-weight="700">Hotkey Studio</text>
    <text x="922" y="126" text-anchor="end" fill="#66707c" font-size="13">esc</text>
    <text x="78" y="162" fill="#f5a524" font-size="15">Search actions…</text>
    <line x1="78" y1="178" x2="922" y2="178" stroke="#2b3644"/>

    <text x="78" y="212" fill="#66707c" font-size="12" letter-spacing="2">STUDIO</text>
    <rect x="66" y="226" width="856" height="40" rx="6" fill="#1b2430" stroke="#3a4655"/>
    <text x="84" y="251" fill="#f0f6fc" font-size="16">Preset: Native first</text>
    <text x="310" y="251" fill="#66707c" font-size="14">Switch the base preset</text>
    <text x="84" y="294" fill="#c3ccd6" font-size="15">Reset all overrides</text>
    <text x="310" y="294" fill="#66707c" font-size="14">Restore the selected preset</text>
    <text x="84" y="328" fill="#c3ccd6" font-size="15">How to persist changes</text>
    <text x="310" y="328" fill="#66707c" font-size="14">Show the tui.json snippet</text>

    <text x="78" y="372" fill="#66707c" font-size="12" letter-spacing="2">HOTKEYS: SESSIONS</text>
    <text x="84" y="404" fill="#c3ccd6" font-size="15">New session (Alt+T)</text>
    <text x="310" y="404" fill="#66707c" font-size="14">Open the new-session composer</text>
    <text x="84" y="438" fill="#c3ccd6" font-size="15">Session picker (Alt+O)</text>
    <text x="310" y="438" fill="#66707c" font-size="14">Switch to a session</text>

    <text x="78" y="482" fill="#66707c" font-size="12" letter-spacing="2">HOTKEYS: SWITCHING</text>
    <text x="84" y="514" fill="#c3ccd6" font-size="15">Switch to session 1 (Alt+1)</text>
    <text x="310" y="514" fill="#66707c" font-size="14">Jump to quick slot 1</text>
    <text x="84" y="548" fill="#c3ccd6" font-size="15">Switch to session 2 (Alt+2)</text>
    <text x="310" y="548" fill="#66707c" font-size="14">Jump to quick slot 2</text>

    <line x1="78" y1="578" x2="922" y2="578" stroke="#2b3644"/>
    <text x="78" y="604" fill="#66707c" font-size="13">↑↓ navigate    enter select    esc close</text>
    <text x="922" y="604" text-anchor="end" fill="#f5a524" font-size="13">Alt+K</text>
  </g>
</svg>
